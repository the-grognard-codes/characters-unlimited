name: Checks
on: [push, pull_request]
jobs:
  character-workflows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m mypy --check-untyped-defs characters_unlimited tests
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q characters_unlimited tests
      - name: Check all browser scripts
        shell: pwsh
        run: |
          foreach ($browserScript in Get-ChildItem characters_unlimited/web -Filter '*.js') {
            node --check $browserScript.FullName
            if ($LASTEXITCODE -ne 0) { throw "Browser syntax failed: $($browserScript.Name)" }
          }
      - run: ./scripts/build-windows.ps1
      - name: Exercise the frozen executable without developer tools
        shell: pwsh
        run: |
          $env:CHARACTERS_UNLIMITED_EXE = (Resolve-Path dist/CharactersUnlimited/CharactersUnlimited.exe).Path
          python -m unittest tests.test_packaged_app -v
      - uses: actions/upload-artifact@v4
        with:
          name: CharactersUnlimited-Windows-early
          path: dist/CharactersUnlimited/
          retention-days: 14
