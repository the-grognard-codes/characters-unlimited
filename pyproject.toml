[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "characters-unlimited"
version = "0.1.0"
description = "Offline Palladium character creation and advancement"
requires-python = ">=3.11"

[tool.setuptools.package-data]
characters_unlimited = ["web/*", "packs/*.json"]
